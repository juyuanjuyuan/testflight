<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Product — Loomline Goods</title><link rel="stylesheet" href="shop.css"></head>
<body>
<header><span class="logo"><img src="../assets/mark.svg" alt="" width="32" height="32">Loomline Goods</span><button type="button" class="btn light" id="cartbtn">Cart</button></header>
<div id="promo">Free shipping over $50</div>
<main class="product">
  <div class="swatch" id="swatch"><img id="pimg" alt="" width="400" height="400"></div>
  <h1 id="pname"></h1>
  <p id="pprice"></p>
  <button type="button" class="btn" id="add" data-barrier="B1">🛒</button>
  <div id="toast" data-barrier="B2"></div>
  <p>Sturdy, washable and made to last. Ships in two business days.</p>
  <a href="index.html">Back to all products</a>
</main>
<footer><p class="foot-brand"><img src="../assets/mark.svg" alt="" width="28" height="28">Loomline Goods</p><p>Canvas, wool and stoneware from small workshops.</p><p class="foot-small">© 2026 Loomline Goods</p></footer>
<div class="modal" id="cart" role="dialog" aria-modal="true" aria-labelledby="cart-title" tabindex="-1" hidden>
  <div class="sheet">
    <h2 id="cart-title">Your cart</h2>
    <ul></ul>
    <p id="subtotal" data-barrier="B4"></p>
    <button type="button" class="btn" id="gocheckout">Checkout</button>
    <button type="button" class="btn light" id="keepshopping">Keep shopping</button>
  </div>
</div>
<script src="shop.js"></script>
<script>
  initCart();
  const p = PRODUCTS[new URLSearchParams(location.search).get('id')] || PRODUCTS.tote;
  document.title = `${p.name} — Loomline Goods`;
  pname.textContent = p.name;
  pprice.textContent = money(p.price);
  const art = { tote: { bg: '#efe6d6', alt: 'Natural canvas tote bag' }, beanie: { bg: '#f3e3dc', alt: 'Rust-red knit wool beanie with a pom-pom' }, mug: { bg: '#e3ece9', alt: 'Sage-green stoneware mug' } }[p.id];
  swatch.style.background = art.bg;
  pimg.src = `../assets/${p.id}.svg`;
  pimg.alt = art.alt;
  add.addEventListener('click', () => { addToCart(p.id); toast.textContent = `${p.name} added to cart`; });
</script>
</body></html>
