# Ground truth for sites/shop/original, MAIN flow only (see docs/plans/05-fake-shop.md).
# The second flow has its own file (shop-second.yaml): blocking barriers stop the planner, so each flow is scored separately.
# The element (or its container) MUST carry data-barrier="<id>" in the HTML so scoring is exact.
# Planted by the same team that wrote the detectors (hackathon); see sites/shop/README.md.
# detectable: ours = our detectors should catch it; vision-only = only a visual check can (counted as a miss unless plan 13 is done).
# Scripted route: eval/keys.shop.main.json (same script for original and fixed).
site: sites/shop/original
variant: original
flow: main
goal: "Buy a canvas tote bag. Pay with card 4000 0000 0000 0002; if it is declined, use 4242 4242 4242 4242."
barriers:
  - { id: B1, kind: weak-name,     wcag: ["4.1.2"],          impact: block,   flow: main, detectable: ours,        note: "product page: add-to-cart button named only 🛒" }
  - { id: B2, kind: unannounced,   wcag: ["4.1.3"],          impact: degrade, flow: main, detectable: ours,        note: "product page: 'Canvas Tote Bag added to cart' toast not in a live region" }
  - { id: B3, kind: text-in-image, wcag: ["1.4.5", "1.1.1"], impact: degrade, flow: main, detectable: vision-only, note: "list page: sale text printed on an image, alt is only 'Summer sale'" }
  - { id: B4, kind: unannounced,   wcag: ["4.1.3"],          impact: degrade, flow: main, detectable: ours,        note: "cart dialog: quantity and subtotal update silently" }
  - { id: B5, kind: weak-name,     wcag: ["4.1.2", "2.4.6"], impact: degrade, flow: main, detectable: ours,        note: "cart dialog: quantity buttons named '−' / '+', no item in the name" }
  - { id: B6, kind: focus-lost,    wcag: ["2.4.3"],          impact: degrade, flow: main, detectable: ours,        note: "cart dialog: Remove drops focus to <body>; every Remove button has the same name" }
  - { id: B7, kind: unannounced,   wcag: ["4.1.3", "3.3.1"], impact: block,   flow: main, detectable: ours,        note: "checkout: 'Card declined' not announced and not associated with the card field" }
  - { id: B8, kind: focus-visible, wcag: ["2.4.7"],          impact: degrade, flow: main, detectable: ours,        note: "checkout: outline:none on the payment form's field and Pay button (needs plan 07)" }
