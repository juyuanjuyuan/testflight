# Ground truth for sites/shop/original. One entry per planted barrier.
# The element (or its container) MUST carry data-barrier="<id>" in the HTML so scoring is exact.
# Owner: whoever builds the fake shop. Ideally planted WITHOUT the detector author looking (reduces overfitting claims).
site: sites/shop/original
variant: original
goal: "Buy a canvas tote bag"
barriers:
  - { id: B1, kind: weak-name,     wcag: ["4.1.2"],          impact: block,   note: "add-to-cart button named only 🛒" }
  - { id: B2, kind: unannounced,   wcag: ["4.1.3"],          impact: degrade, note: "'Added to cart' toast not announced" }
  - { id: B3, kind: unannounced,   wcag: ["4.1.3", "3.3.1"], impact: block,   note: "'Card number is invalid' not announced / not associated" }
  # - { id: B4, kind: trap, ... }  — make the trap BLOCK THE TASK: e.g. a promo popup before checkout with no keyboard exit
