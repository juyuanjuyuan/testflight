<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">How ClearAccess audits a task</title>
  <desc id="d">The web app starts an audit through the HTTP API. On each step the website is driven by Playwright; a screen recorder captures what appeared on screen and a virtual screen reader captures what a user would hear. Only the heard channel crosses the information barrier to the planner, an LLM that acts with the keyboard; code checks every action before it reaches the site. After the run, rule-based detectors compare seen and heard, an LLM judge rates impact on the task, the report is written, an LLM fixer proposes edits, and the task is re-tested on a patched copy.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #1C2230; }
      .h { font-size: 26px; font-weight: 700; letter-spacing: -0.2px; }
      .sub { font-size: 15px; fill: #5B6474; }
      .band { font-size: 14px; font-weight: 600; fill: #5B6474; }
      .name { font-size: 16px; font-weight: 650; }
      .note { font-size: 12.5px; fill: #5B6474; }
      .edge { font-size: 12.5px; fill: #5B6474; }
      .code { fill: #FFFFFF; stroke: #9AA3B2; stroke-width: 1.4; }
      .llm { fill: #F2EEFF; stroke: #6E56CF; stroke-width: 1.6; }
      .file { fill: #FFFFFF; stroke: #9AA3B2; stroke-width: 1.4; stroke-dasharray: 0; }
      .seen { fill: #EEF1F5; stroke: #475569; stroke-width: 1.6; }
      .heard { fill: #E3F5F2; stroke: #0E8C7F; stroke-width: 1.8; }
      .line { stroke: #7C8595; stroke-width: 1.6; fill: none; }
      .line-heard { stroke: #0E8C7F; stroke-width: 2.4; fill: none; }
      .line-seen { stroke: #475569; stroke-width: 1.8; fill: none; }
      .wall { stroke: #D9480F; stroke-width: 3; stroke-dasharray: 9 7; }
      .walltext { font-size: 14px; font-weight: 700; fill: #D9480F; }
      .spark { fill: #6E56CF; font-size: 15px; font-weight: 700; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C8595"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E8C7F"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="stop" viewBox="0 0 10 20" refX="5" refY="10" markerWidth="7" markerHeight="14" orient="auto"><path d="M5,0 L5,20" stroke="#D9480F" stroke-width="3"/></marker>
  </defs>

  <rect x="0.5" y="0.5" width="1279" height="779" rx="18" fill="#F7F8FA" stroke="#D9DEE7"/>

  <text class="h" x="40" y="50">How ClearAccess audits a task</text>
  <text class="sub" x="40" y="76">The agent hears only what a screen reader would say. Everything it misses is a finding.</text>

  <!-- Band A: web app and API -->
  <text class="band" x="40" y="116">Starting and watching a run</text>
  <rect class="code" x="40" y="128" width="230" height="60" rx="6"/>
  <text class="name" x="56" y="153">Web app</text>
  <text class="note" x="56" y="173">start, watch live, fix, re-test</text>

  <rect class="code" x="320" y="128" width="230" height="60" rx="6"/>
  <text class="name" x="336" y="153">HTTP API</text>
  <text class="note" x="336" y="173">/api/runs, /api/tasks/suggest</text>

  <rect class="code" x="600" y="128" width="230" height="60" rx="6"/>
  <text class="name" x="616" y="153">Audit process</text>
  <text class="note" x="616" y="173">one run at a time, isolated</text>

  <path class="file" d="M880,124 h170 l14,14 v22 h-184 z"/>
  <text class="name" x="894" y="147" style="font-size:14.5px">progress.json</text>
  <text class="note" x="1004" y="147">live</text>
  <path class="file" d="M880,164 h170 l14,14 v22 h-184 z"/>
  <text class="name" x="894" y="187" style="font-size:14.5px">report.json</text>
  <text class="note" x="1000" y="187">final</text>

  <line class="line" x1="270" y1="158" x2="316" y2="158" marker-end="url(#a)"/>
  <line class="line" x1="550" y1="158" x2="596" y2="158" marker-end="url(#a)"/>
  <path class="line" d="M830,152 C850,152 856,142 876,142" marker-end="url(#a)"/>
  <path class="line" d="M830,164 C850,164 856,182 876,182" marker-end="url(#a)"/>
  <text class="edge" x="1080" y="147">the web app polls</text>
  <text class="edge" x="1080" y="163">progress every second,</text>
  <text class="edge" x="1080" y="179">then opens the report</text>

  <!-- Band B: every step -->
  <line x1="40" y1="216" x2="1240" y2="216" stroke="#E3E7EE"/>
  <text class="band" x="40" y="244">Every step of the run</text>

  <rect class="code" x="40" y="318" width="220" height="96" rx="6"/>
  <text class="name" x="56" y="346">Website under test</text>
  <text class="note" x="56" y="368">real Chromium, driven by</text>
  <text class="note" x="56" y="386">Playwright with real keys</text>

  <rect class="seen" x="330" y="258" width="250" height="70" rx="6"/>
  <text class="name" x="346" y="284">Screen recorder</text>
  <text class="note" x="346" y="306">new visible text, focus, screenshots</text>

  <rect class="heard" x="330" y="416" width="250" height="70" rx="6"/>
  <text class="name" x="346" y="442">Virtual screen reader</text>
  <text class="note" x="346" y="464">what is announced, word for word</text>

  <path class="line-seen" d="M260,350 C295,350 295,293 326,293" marker-end="url(#as)"/>
  <path class="line-heard" d="M260,384 C295,384 295,451 326,451" marker-end="url(#ah)"/>

  <rect class="seen" x="620" y="270" width="200" height="46" rx="23"/>
  <text class="name" x="640" y="299" style="font-size:15px">What the screen showed</text>
  <rect class="heard" x="620" y="428" width="200" height="46" rx="23"/>
  <text class="name" x="646" y="457" style="font-size:15px">What the user heard</text>
  <line class="line-seen" x1="580" y1="293" x2="616" y2="293" marker-end="url(#as)"/>
  <line class="line-heard" x1="580" y1="451" x2="616" y2="451" marker-end="url(#ah)"/>

  <!-- information barrier -->
  <line class="wall" x1="866" y1="240" x2="866" y2="500"/>
  <text class="walltext" x="878" y="252">Information barrier</text>
  <line class="line-seen" x1="820" y1="293" x2="860" y2="293" marker-end="url(#stop)"/>
  <text class="edge" x="878" y="290">screen contents never</text>
  <text class="edge" x="878" y="306">reach the agent</text>
  <path class="line-heard" d="M820,451 L956,451" marker-end="url(#ah)"/>

  <rect class="code" x="960" y="322" width="170" height="74" rx="6"/>
  <text class="name" x="976" y="346">Goal</text>
  <text class="note" x="976" y="366">task, with test data</text>
  <text class="note" x="976" y="382">added by code</text>
  <line class="line" x1="1045" y1="396" x2="1045" y2="412" marker-end="url(#a)"/>

  <rect class="llm" x="960" y="416" width="170" height="70" rx="20"/>
  <text class="spark" x="976" y="444">✦</text>
  <text class="name" x="994" y="444">Planner</text>
  <text class="note" x="976" y="466">acts with the keyboard</text>

  <rect class="code" x="1160" y="416" width="80" height="70" rx="6"/>
  <text class="name" x="1172" y="444">Guard</text>
  <text class="note" x="1172" y="464">code</text>
  <text class="note" x="1172" y="478">checks</text>
  <line class="line" x1="1130" y1="451" x2="1156" y2="451" marker-end="url(#a)"/>

  <path class="line" d="M1200,486 V518 H220 V418" marker-end="url(#a)"/>
  <text class="edge" x="560" y="512">Tab, Enter, type (only values given in the goal), stop at checkout on real sites</text>

  <!-- Band C: after the run -->
  <line x1="40" y1="548" x2="1240" y2="548" stroke="#E3E7EE"/>
  <text class="band" x="40" y="576">After the run</text>

  <line class="line" x1="160" y1="414" x2="160" y2="596" marker-end="url(#a)"/>
  <text class="edge" x="170" y="592">recorded every step</text>

  <path class="file" d="M40,600 h128 l14,14 v50 h-142 z"/>
  <text class="name" x="54" y="628">trace</text>
  <text class="note" x="54" y="648">seen + heard</text>

  <rect class="code" x="212" y="600" width="190" height="64" rx="6"/>
  <text class="name" x="228" y="626">Detectors</text>
  <text class="note" x="228" y="646">rules: seen but not heard</text>

  <rect class="llm" x="432" y="600" width="180" height="64" rx="20"/>
  <text class="spark" x="448" y="627">✦</text>
  <text class="name" x="466" y="627">Judge</text>
  <text class="note" x="448" y="647">impact on this task</text>

  <path class="file" d="M642,600 h166 l14,14 v50 h-180 z"/>
  <text class="name" x="656" y="626">Report</text>
  <text class="note" x="656" y="646">can, cannot, inconclusive</text>

  <rect class="llm" x="852" y="600" width="170" height="64" rx="20"/>
  <text class="spark" x="868" y="627">✦</text>
  <text class="name" x="886" y="627">Fixer</text>
  <text class="note" x="868" y="647">edits, text kept</text>

  <rect class="code" x="1052" y="600" width="188" height="64" rx="6"/>
  <text class="name" x="1068" y="626">Re-test</text>
  <text class="note" x="1068" y="646">patched copy, same goal</text>

  <line class="line" x1="182" y1="632" x2="208" y2="632" marker-end="url(#a)"/>
  <line class="line" x1="402" y1="632" x2="428" y2="632" marker-end="url(#a)"/>
  <line class="line" x1="612" y1="632" x2="638" y2="632" marker-end="url(#a)"/>
  <line class="line" x1="822" y1="632" x2="848" y2="632" marker-end="url(#a)"/>
  <line class="line" x1="1022" y1="632" x2="1048" y2="632" marker-end="url(#a)"/>
  <text class="note" x="228" y="686">axe-core runs alongside as a baseline</text>
  <text class="note" x="1068" y="686">a fix counts only if</text>
  <text class="note" x="1068" y="702">the task now completes</text>

  <!-- legend -->
  <line x1="40" y1="722" x2="1240" y2="722" stroke="#E3E7EE"/>
  <rect class="code" x="40" y="738" width="28" height="20" rx="4"/>
  <text class="note" x="76" y="753">deterministic code</text>
  <rect class="llm" x="210" y="738" width="28" height="20" rx="10"/>
  <text class="spark" x="218" y="753" style="font-size:12px">✦</text>
  <text class="note" x="246" y="753">language model</text>
  <rect class="seen" x="370" y="738" width="28" height="20" rx="10"/>
  <text class="note" x="406" y="753">what appeared on screen</text>
  <rect class="heard" x="570" y="738" width="28" height="20" rx="10"/>
  <text class="note" x="606" y="753">what a screen-reader user hears</text>
  <line class="wall" x1="810" y1="748" x2="850" y2="748"/>
  <text class="note" x="860" y="753">the agent never crosses this line</text>
</svg>
