# Operational fit: the product runs as a PR check. Every front-end change re-runs the critical task flow.
# Weekend version: deterministic key script + detectors (no LLM needed, no secrets in CI).
# With SCIFORIUM_API_KEY set as a repo secret, drop --script/--no-judge to use the planner + judge.
name: task-level a11y audit
on: [push, pull_request, workflow_dispatch]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Serve demo sites
        run: node scripts/serve.mjs & sleep 1
      - name: Audit the shop's checkout flow (hand-fixed version)
        run: |
          mkdir -p runs/ci-shop-fixed
          node cli.mjs audit --url http://localhost:8080/shop/fixed/ \
            --goal "Buy a canvas tote bag. Pay with the test card 4000 0000 0000 0002. If it is declined, try 4242 4242 4242 4242." \
            --script eval/keys.shop.main.json --no-judge --run-dir runs/ci-shop-fixed --fail-on block
      # Without the judge every candidate is "degrade", so --fail-on block alone can never fail here.
      # The fixed shop has no planted barriers: any finding at all is a regression.
      - name: Fail on any finding
        run: |
          node -e "const c = require('./runs/ci-shop-fixed/report.json').counts;
            if (c.block + c.degrade) { console.error('findings on the fixed shop: block ' + c.block + ', degrade ' + c.degrade); process.exit(1); }"
      - name: Report in job summary
        if: always()
        run: cat runs/*/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: audit-run, path: runs/ }
